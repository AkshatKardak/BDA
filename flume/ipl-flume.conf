# ==============================================================================
# Apache Flume Agent Configuration for IPL Streaming Ingestion
# Agent Name: agent
# Pipeline:   Exec Source / Netcat Source -> Memory Channel -> HDFS Sink
# Destination: /ipl/raw/deliveries/YYYY-MM-DD/
# ==============================================================================

# Define Agent Components
agent.sources = r1
agent.channels = c1
agent.sinks = k1

# ------------------------------------------------------------------------------
# Source Configuration: Exec Source
# Replays real normalized IPL ball-by-ball delivery records continuously
# ------------------------------------------------------------------------------
agent.sources.r1.type = exec
agent.sources.r1.command = python3 streaming/replay_ipl.py --file data/normalized/deliveries.csv --delay 0.01
agent.sources.r1.restart = true
agent.sources.r1.restartThrottle = 10000
agent.sources.r1.logStdErr = true

# NOTE: For TCP Socket Netcat mode instead, uncomment the following:
# agent.sources.r1.type = netcat
# agent.sources.r1.bind = 0.0.0.0
# agent.sources.r1.port = 44444
# agent.sources.r1.max-line-length = 4096

# ------------------------------------------------------------------------------
# Channel Configuration: Memory Channel
# In-memory buffer providing high throughput and event buffering
# ------------------------------------------------------------------------------
agent.channels.c1.type = memory
agent.channels.c1.capacity = 100000
agent.channels.c1.transactionCapacity = 1000
agent.channels.c1.keep-alive = 3

# ------------------------------------------------------------------------------
# Sink Configuration: HDFS Sink
# Writes streaming records directly into Hadoop HDFS raw lake partition
# ------------------------------------------------------------------------------
agent.sinks.k1.type = hdfs
agent.sinks.k1.hdfs.path = hdfs://localhost:9000/ipl/raw/deliveries/%Y-%m-%d
agent.sinks.k1.hdfs.filePrefix = ipl-deliveries
agent.sinks.k1.hdfs.fileSuffix = .csv
agent.sinks.k1.hdfs.fileType = DataStream
agent.sinks.k1.hdfs.writeFormat = Text

# Rolling policy: roll on 30 seconds, 10MB file size, or 5,000 events
agent.sinks.k1.hdfs.rollInterval = 30
agent.sinks.k1.hdfs.rollSize = 10485760
agent.sinks.k1.hdfs.rollCount = 5000
agent.sinks.k1.hdfs.batchSize = 1000

# Timestamp interceptor / local timestamp resolution
agent.sinks.k1.hdfs.useLocalTimeStamp = true

# Idle timeout to flush partial files if stream ceases (60 seconds)
agent.sinks.k1.hdfs.idleTimeout = 60

# ------------------------------------------------------------------------------
# Bind Source and Sink to Channel
# ------------------------------------------------------------------------------
agent.sources.r1.channels = c1
agent.sinks.k1.channel = c1
